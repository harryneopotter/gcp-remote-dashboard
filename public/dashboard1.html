<!-- public/dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Docker Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="app.js" defer></script>
</head>
<body class="bg-[#e0e5ec] text-gray-700 font-sans">
  <div class="container mx-auto p-4 md:p-8">
    <header class="flex justify-between items-center mb-8 border-b border-gray-300 pb-4">
      <h1 class="text-2xl font-bold text-gray-800">Remote Docker Dashboard</h1>
      <div class="flex items-center space-x-2">
        <span class="relative flex h-3 w-3">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-indigo-500"></span>
        </span>
        <span class="text-sm font-medium text-gray-600">Online</span>
      </div>
    </header>
    <main>
      <section class="mt-12">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Log Viewer</h2>
        <div class="flex space-x-4 mb-4">
          <button id="btn-logs-sd-forge"
            class="font-semibold py-2 px-4 rounded-lg bg-[#e0e5ec] text-gray-600 shadow-[5px_5px_10px_#a3b1c6,_-5px_-5px_10px_#ffffff] active:shadow-inner active:shadow-[#a3b1c6] transition-all duration-200">
            Fetch SD Forge Logs
          </button>
          <button id="btn-logs-filebrowser"
            class="font-semibold py-2 px-4 rounded-lg bg-[#e0e5ec] text-gray-600 shadow-[5px_5px_10px_#a3b1c6,_-5px_-5px_10px_#ffffff] active:shadow-inner active:shadow-[#a3b1c6] transition-all duration-200">
            Fetch Filebrowser Logs
          </button>
        </div>
        <div class="bg-gray-900 rounded-lg p-4 h-96 overflow-y-auto border border-gray-700">
          <pre id="log-output" class="text-xs text-gray-300 font-mono whitespace-pre-wrap"></pre>
        </div>
        <div class="flex space-x-4 mt-4">
          <button id="btn-clear-logs-sd-forge"
            class="font-semibold py-2 px-4 rounded-lg bg-[#e0e5ec] text-red-600 shadow-[5px_5px_10px_#a3b1c6,_-5px_-5px_10px_#ffffff] active:shadow-inner active:shadow-[#a3b1c6] transition-all duration-200"
            onclick="clearLogs('sd-forge')">
            🧹 Clear SD Forge Logs
          </button>
          <button id="btn-clear-logs-filebrowser"
            class="font-semibold py-2 px-4 rounded-lg bg-[#e0e5ec] text-red-600 shadow-[5px_5px_10px_#a3b1c6,_-5px_-5px_10px_#ffffff] active:shadow-inner active:shadow-[#a3b1c6] transition-all duration-200"
            onclick="clearLogs('filebrowser')">
            🧹 Clear Filebrowser Logs
          </button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
